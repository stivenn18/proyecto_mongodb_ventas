services:
  - type: web
    name: ventas-wishlist-app
    env: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CONFIGCAT_SDK_KEY
        sync: false
      - key: MONGO_URI
        sync: false
